<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
            integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
            crossorigin="anonymous"
    />
    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
            crossorigin="anonymous"
    />

    <title>{% block title %}Home{% endblock %}</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#navbar"
    >
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbar">
        <div class="navbar-nav">
            <a class="nav-item nav-link" id="home" href="/">Home</a>
        </div>
    </div>
</nav>
<form id="inputForm" class="container mt-5" style="max-width: 500px;">
    <div class="form-group" id="model-form">
        <label for="modelInput"></label>
        <input type="text" class="form-control" id="modelInput"
               placeholder="Enter message">
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
    <div id="chatBox" class="mt-3 p-3 border rounded bg-light"
         style="display: none; max-height: 500px; overflow-y: auto;"></div>
</form>

<script
        src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"
></script>
<script
        src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"
></script>
<script
        src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"
></script>

<script>
    document.getElementById('inputForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const userInput = document.getElementById("modelInput").value;
        if (!userInput.trim()) return;

        const chatBox = document.getElementById("chatBox");

        if (chatBox.style.display === 'none') {
            chatBox.style.display = 'block';
        }
        const userMessage = document.createElement('div');
        userMessage.className = 'p-2 my-2 border rounded bg-primary text-white';
        userMessage.innerText = "User: " + userInput;
        chatBox.appendChild(userMessage);

        document.getElementById("modelInput").value = '';

        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch('chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({user_input: userInput})
            });

            const data = await res.json();
            console.log('Server response:', data);

            const chatResponse = document.createElement('div');
            chatResponse.className = 'p-2 my-2 border rounded bg-light';
            chatResponse.innerText = "Chat: " + (data.response || data.error);
            chatBox.appendChild(chatResponse);

            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            console.error(error);
        }
    });
</script>

</body>
</html>
